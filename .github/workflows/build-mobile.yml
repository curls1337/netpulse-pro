name: Build Mobile App (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Lib
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.devcurl.app --project-name app_mobile .
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ./NetPulsePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ./NetPulsePro.apk

  build-ios:
    name: Build iOS Sideload IPA (Flutter)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Lib
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.devcurl.app --project-name app_mobile .
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml
          flutter pub get

      - name: Build Unsigned iOS App via xcodebuild
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          cd ..
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r ./NetPulsePro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./NetPulsePro.ipa

  publish-release:
    name: Publish IPA & APK to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: ./release-files

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: iOS-IPA
          path: ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NetPulse Pro v1.0.${{ github.run_number }} (iOS .ipa & Android .apk)"
          body: |
            ## 🚀 NetPulse Pro Mobile Installation Packages
            Aplikasi pemantau kecepatan internet real-time dan kuota pemakaian data (MB/GB) per 1 jam, mingguan, bulanan, dan tahunan dilengkapi fitur Widget iOS & Android.

            ### 📦 Download File Instalasi:
            - 📱 **`NetPulsePro.ipa`**: iOS Sideload (Install via TrollStore, ESign, Scarlet, AltStore, Sideloadly)
            - 🤖 **`NetPulsePro.apk`**: Android Direct Install (ARM64 / Universal)
          draft: false
          prerelease: false
          files: |
            ./release-files/NetPulsePro.ipa
            ./release-files/NetPulsePro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
