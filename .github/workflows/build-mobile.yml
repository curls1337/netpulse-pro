name: Build Mobile App (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Lib
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.devcurl.netpulse --project-name netpulse_pro .
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="netpulse_pro"/android:label="NetPulse Pro"/' android/app/src/main/AndroidManifest.xml || true
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ./NetPulsePro-v2.apk
          cp build/app/outputs/flutter-apk/app-release.apk ./NetPulsePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ./NetPulsePro-v2.apk

  build-ios:
    name: Build iOS Sideload IPA (Flutter)
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Shells & Restore Custom Lib
        run: |
          mkdir -p /tmp/custom_src
          cp -r lib /tmp/custom_src/
          cp pubspec.yaml /tmp/custom_src/
          flutter create --platforms=android,ios --org com.devcurl.netpulse --project-name netpulse_pro .
          cp -r /tmp/custom_src/lib/* lib/
          cp /tmp/custom_src/pubspec.yaml pubspec.yaml
          cp custom_ios/Info.plist ios/Runner/Info.plist
          cp custom_ios/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp custom_ios/NetPulseAttributes.swift ios/Runner/NetPulseAttributes.swift
          flutter pub get

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Native iOS WidgetKit Extension (.appex)
        run: |
          cd ios_widget
          xcodegen generate
          xcodebuild build \
            -project NetPulseWidget.xcodeproj \
            -scheme NetPulseWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_widget \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cd ..

      - name: Build Unsigned iOS App via xcodebuild
        run: |
          flutter build ios --config-only --no-codesign
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          cd ..
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/Runner.app Payload/
          mkdir -p Payload/Runner.app/PlugIns
          cp -r ios_widget/build_widget/Build/Products/Release-iphoneos/NetPulseWidget.appex Payload/Runner.app/PlugIns/
          zip -r ./NetPulsePro-v2.ipa Payload
          cp ./NetPulsePro-v2.ipa ./NetPulsePro.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ./NetPulsePro-v2.ipa

  publish-release:
    name: Publish IPA & APK to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: ./release-files

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: iOS-IPA
          path: ./release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "NetPulse Pro v2.0.${{ github.run_number }} (Fresh App ID & Clean Cache)"
          body: |
            ## 🚀 NetPulse Pro Mobile Installation Packages (v2 Update)
            Pembaruan aplikasi: Tombol pemasangan widget, toggle batas harian + edit MB, serta indikator ISP pada widget.

            > ⚠️ **PENTING UNTUK PENGGUNA SIDELOAD iOS (ESign / Scarlet / TrollStore)**:
            > **Hapus / Uninstall aplikasi NetPulse Pro versi lama dari Home Screen iPhone Anda terlebih dahulu**, lalu unduh dan install file baru `NetPulsePro-v2.ipa` di bawah ini agar cache signature lama tidak bentrok!

            ### 📦 Download File Instalasi:
            - 📱 **`NetPulsePro-v2.ipa`**: iOS Sideload (Fresh Bundle ID: `com.devcurl.netpulse.netpulsePro`)
            - 🤖 **`NetPulsePro-v2.apk`**: Android Direct Install
          draft: false
          prerelease: false
          files: |
            ./release-files/NetPulsePro-v2.ipa
            ./release-files/NetPulsePro-v2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
